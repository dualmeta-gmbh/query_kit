include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - query/**
    # Analyzer fixtures, half of them code that must not compile. They are
    # analyzed by tool/check_typed_query_fixtures.dart, in a consumer package
    # of their own.
    - tool/typed_query_fixtures/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
