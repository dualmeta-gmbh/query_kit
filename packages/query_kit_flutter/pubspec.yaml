name: query_kit_flutter
description: >-
  TanStack Query for Flutter: cached server data, background refetching,
  retries, mutations and infinite queries, read in four equal styles.
  AI-coded, not affiliated with TanStack.
version: 1.0.3
homepage: https://query-kit.dualmeta.io/
documentation: https://query-kit.dualmeta.io/docs/overview
repository: https://github.com/dualmeta-gmbh/query_kit
issue_tracker: https://github.com/dualmeta-gmbh/query_kit/issues
topics:
  - cache
  - state-management
  - data-fetching
  - tanstack-query
  - react-query

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  query_kit: ^1.0.0

dev_dependencies:
  clock: ^1.1.1
  flutter_test:
    sdk: flutter
  lints: '>=5.1.1 <7.0.0'
