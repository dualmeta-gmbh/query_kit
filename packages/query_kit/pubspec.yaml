name: query_kit
description: >-
  TanStack Query for Dart: a port of query-core with caching, background
  refetching, retries and mutations, no Flutter needed. AI-coded, not
  affiliated with TanStack.
version: 1.0.2
homepage: https://query-kit.dualmeta.io/
documentation: https://query-kit.dualmeta.io/docs/overview
repository: https://github.com/dualmeta-gmbh/query_kit
issue_tracker: https://github.com/dualmeta-gmbh/query_kit/issues
topics:
  - cache
  - state-management
  - data-fetching
  - tanstack-query
  - react-query

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  clock: ^1.1.1
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: '>=5.1.1 <7.0.0'
  test: ^1.25.0
