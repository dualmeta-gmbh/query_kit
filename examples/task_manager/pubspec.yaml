name: task_manager
description: >-
  A task manager on query_kit_flutter, against a deliberately slow express
  backend with scripted failures: optimistic writes, rollback, polling that
  stops, and one cache entry read by two screens.
version: 1.0.0-dev
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  query_kit_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: '>=5.1.1 <7.0.0'

flutter:
  # Bundles the Material icon font. Without it every Icon renders as a tofu box
  # — the pubspec here was hand-written, and `flutter create` does not add this
  # to an existing one.
  uses-material-design: true

  # Roboto, bundled. A web build whose manifest has no Roboto downloads it
  # from fonts.gstatic.com before the app starts — the engine waits for that
  # download — so the end-to-end suites would boot only as fast as the
  # internet answers, and a stalled request left the page blank. Apache 2.0,
  # fonts/LICENSE.txt; the weights the screens use.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
